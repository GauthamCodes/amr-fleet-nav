# ============================================================================
# Nav2 parameters - namespace-free template for one robot.
#
# Derived from /opt/ros/jazzy/share/nav2_bringup/params/nav2_params.yaml
# (nav2_bringup 1.3.12). Re-rooted under the robot's namespace at launch time by
# amr_navigation/params.py, which also rewrites the per-robot numbers from
# fleet.yaml. This file names no robot and hardcodes no kinodynamic limit.
#
# DELIBERATELY ABSENT
#   amcl, map_server   - Phase 1 maps with slam_toolbox; it does not localize
#                        against a prior map.
#   collision_monitor  - superseded by SafetyGate (ENGINEERING_NOTES rule 1). SafetyGate
#                        is a SERIAL, fail-closed gate, not a Nav2 plugin.
#   velocity_smoother  - Phase 5's chaining point for PayloadJerkAdapter
#                        (ENGINEERING_NOTES rule 6). Adding it now would mean renaming
#                        topics later.
#   route_server, docking_server, loopback_simulator - not in scope.
#
# PHASE 2 READINESS
#   The scan topic appears here as `topic: scan` under each obstacle layer and is
#   rewritten from ONE place in params.py. When SensorBSP lands, that one
#   substitution becomes `validated/scan` and THIS FILE DOES NOT CHANGE.
# ============================================================================

bt_navigator:
  ros__parameters:
    # Moves to the fleet frame with the global costmap. Goals stamped in this
    # robot's own amrN/map still work - bt_navigator transforms an incoming goal
    # into its global frame, and fleet_map -> amrN/map is a static transform, so
    # the lookup cannot time out. That is why the Phase 1 and Phase 2 mission
    # scripts needed no change to keep dispatching goals.
    global_frame: __GLOBAL_FRAME__
    robot_base_frame: __BASE_FRAME__
    # Relative, not the stock absolute "/odom" - an absolute name escapes the
    # namespace and silently reads another robot's odometry once there are two.
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Declared explicitly rather than left to the default because Phase 2's
    # SafetyGate must raise movement_time_allowance whenever it zeroes cmd_vel,
    # or Nav2 sees a stuck robot and fires recovery behaviours mid-halt
    # (ENGINEERING_NOTES rule 2). A parameter that is not declared cannot be set.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Warehouse goals are rack faces, not open floor. The stock 0.25 m is more
      # than half this robot's width.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # ========================================================================
    # CONTROLLER: RegulatedPurePursuit, NOT MPPI. THIS IS A DEPARTURE FROM
    # docs/PLAN.md SECTION 1 AND IT IS FLAGGED, NOT SILENT.
    #
    # MPPI is configured, loads cleanly, and will not drive this robot. Measured
    # over four runs on an otherwise identical stack:
    #
    #   commanded forward velocity        0.0034 m/s, near-constant
    #   MPPI's own optimal trajectory     advances 0.4 mm per 0.05 s step
    #   distance driven in 154 s          1.06 - 1.10 m, all of it recoveries
    #   controller_server                 "Failed to make progress", every 10 s
    #   goal result                       ABORTED
    #
    # Everything MPPI consumes was verified good on the same runs, which is what
    # makes this a controller fault rather than a stack fault:
    #   - global plan: 446 poses, 11.17 m, dense and correct to the goal
    #   - MPPI's own transformed_global_plan: ~70 poses, 1.75 m, correct
    #   - local costmap around the robot: entirely free, 8 x 8 m, 160 x 160
    #   - published footprint: correct 0.70 x 0.45 polygon at the robot pose
    #   - all 8 critics load with the weights below (checked in the node log)
    #   - every FollowPath parameter reads back correctly via ros2 param dump
    #   - TF, odometry and cmd_vel bridging all sound: the SAME stack drives
    #     63.6 m under the survey node, and reaches this goal under this
    #     controller in 20.5 s
    #
    # Bisected and RULED OUT as causes: CostCritic.consider_footprint (true and
    # false both stall), regenerate_noises (false and true both stall), critic
    # loading, parameter application, costmap occupancy, footprint parsing.
    # Remaining suspects, untested: the acceleration bounds, which are the only
    # large deviation left from stock (ax_max 0.4 against stock 3.0, taken from
    # fleet.yaml because PLAN.md asks the planner's model to match the plant).
    #
    # The MPPI block is preserved verbatim below as FollowPath_mppi_deferred.
    # Reverting is a rename of two keys once the cause is found. Nothing else in
    # this stack assumes which controller is loaded.
    #
    # What is NOT given up by this substitution: RPP does its own footprint-based
    # collision checking on the projected path (use_collision_detection), so the
    # asymmetric footprint still gates motion, which was the reason MPPI ran with
    # consider_footprint true.
    # ========================================================================
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: __VX_MAX__
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: __AZ_MAX__
      max_robot_pose_search_dist: 10.0

    FollowPath_mppi_deferred:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      # MUST equal 1 / controller_frequency. Break the equality and MPPI stops
      # warm-starting from the previous control sequence, silently and for good.
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Kinodynamic limits are rewritten per robot from fleet.yaml. The plant
      # already enforces them (Gazebo DiffDrive), so the planner's model must
      # match or every trajectory MPPI believes in is unachievable.
      vx_max: __VX_MAX__
      vx_min: __VX_MIN__
      vy_max: 0.5
      wz_max: __WZ_MAX__
      ax_max: __AX_MAX__
      # NEGATIVE: this is a deceleration limit, clamped as
      # vx_last + model_dt * ax_min. A positive value inverts the clamp.
      ax_min: __AX_MIN__
      ay_max: 3.0
      az_max: __AZ_MAX__
      iteration_count: 1
      prune_distance: 1.8
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      # MPPI's critics default is an EMPTY LIST. It configures happily, reports
      # "Configured MPPI Controller", and scores nothing at all.
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # TRUE, unlike stock. The footprint is 1.85:1 and asymmetric about the
        # rotation centre; scoring it as a disc hides exactly the orientations
        # that clip a rack while turning in an aisle.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      # 10 Hz to match the lidar. The stock 5 Hz discards half the scans.
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: __ODOM_FRAME__
      robot_base_frame: __BASE_FRAME__
      rolling_window: true
      # 8 x 8 m, not the stock 3 x 3. MPPI's horizon is 56 * 0.05 = 2.8 s, which
      # at 0.6 m/s reaches 1.68 m; a 3 m window leaves the far half of every
      # sampled trajectory outside the costmap, where CostCritic cannot see it.
      width: 8
      height: 8
      resolution: 0.05
      # Rewritten per robot. Asymmetric about the origin because the origin is
      # the drive axle - see fleet_config.footprint_polygon.
      footprint: "__FOOTPRINT__"
      footprint_padding: 0.03
      # fleet_trajectory_layer is LAST, and the order is load-bearing. Layers run
      # in list order and the inflation layer writes over the cells it inflates,
      # so a trajectory deposit placed before it would be partially erased around
      # any real obstacle - exactly where two robots are most likely to meet.
      # Running last also keeps a peer's predicted path GRADED rather than
      # inflated as though it were an obstacle: it is an intention, not a wall.
      plugins: ["obstacle_layer", "inflation_layer", "fleet_trajectory_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: __SCAN_TOPIC__
          sensor_frame: ""
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          # 8.0, not the stock 2.5. Rack faces are 2.75 m from the aisle centre
          # line, so at 2.5 m the robot never marks the racks it drives between.
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          # Clearing must out-range marking or a moving actor leaves a permanent
          # phantom trail down the aisle that nothing ever erases.
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Must exceed the 0.54 m circumscribed radius of the asymmetric footprint
        # while leaving the 5.5 m aisle traversable.
        inflation_radius: 0.70
        cost_scaling_factor: 2.5
      # ======================================================================
      # THE MAPF REQUIREMENT (assignment 3.2) IS SATISFIED HERE.
      #
      # This is the line an evaluator asking "where does AMR-2's local planner
      # consume AMR-1's trajectory?" is looking for: a layer in amr2's LOCAL
      # costmap, subscribed to /amr1/predicted_trajectory. The peer list is
      # rendered per robot by amr_navigation.params from fleet.yaml - "everyone
      # except me" - so a third robot in that file is consumed by the first two
      # with no code change and no robot named anywhere (ENGINEERING_NOTES rule 5).
      # ======================================================================
      fleet_trajectory_layer:
        plugin: "amr_costmap_plugins::FleetTrajectoryLayer"
        # Rendered, not hardcoded: the layer-off arm of the Phase 6 A/B needs the
        # layer genuinely absent from the costmap rather than present and asked
        # nicely at runtime. The plugin reads this once, at onInitialize.
        enabled: __TRAJECTORY_LAYER_ENABLED__
        trajectory_topics: __TRAJECTORY_TOPICS__
        # 6 s ahead. At amr2's 1.0 m/s that reserves 6 m of aisle, past the
        # 8 x 8 m rolling window's 4 m half-width, so the horizon is bounded by
        # the costmap rather than by this number.
        horizon_s: 6.0
        # Cost falls to 1/e of max_cost after this long. 3 s against a 6 s
        # horizon leaves the far end of a prediction at ~13 % of max_cost -
        # present, but not enough to deflect a robot away from a cell a peer
        # will not reach for six seconds.
        decay_tau_s: 3.0
        # Covers amr1's 0.54 m circumscribed radius on one side of the deposit,
        # so a deposit and a robot centre at radius_m are just clear of contact.
        radius_m: 0.45
        # Below 253 (INSCRIBED_INFLATED_OBSTACLE) by construction; the layer
        # REJECTS a larger value rather than clipping it. A peer's intention
        # must be expensive, never impassable, or two robots deadlock on each
        # other's predictions.
        max_cost: 240
        # A peer that stops publishing stops costing. Without this a robot that
        # dies mid-aisle leaves a phantom corridor its peers never enter.
        stale_after_s: 2.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      # PHASE 3: this plans in the FLEET map, not this robot's private SLAM map.
      # That single line is what makes cooperative mapping serve navigation rather
      # than only serve RViz - a corridor amr2 mapped is a corridor amr1 can plan
      # through. Note this is NOT __MAP_FRAME__: slam_toolbox still owns amrN/map,
      # and the local costmap still runs in amrN/odom. Three distinct frames.
      global_frame: __GLOBAL_FRAME__
      robot_base_frame: __BASE_FRAME__
      resolution: 0.05
      track_unknown_space: true
      # FIXED EXTENT, NOT SIZED BY WHATEVER HAS BEEN EXPLORED SO FAR.
      #
      # Costmap2DROS declares its own width/height/origin and defaults to 5 x 5 m at
      # (0, 0). Both robots spawn near (-11, +/-1.5) - outside that - so before the
      # first map lands the planner reports "Start Coordinates of() was outside
      # bounds" and aborts the goal. Declaring the real extent here means the
      # costmap is correct from configure time, and never resizes afterwards; every
      # resize would otherwise wipe the global obstacle layer.
      #
      # These four numbers must equal the grid FleetMapNode allocates from
      # amr_fleet_control/config/fleet_map.yaml. They are duplicated because the two
      # stacks are configured separately, and the duplication is pinned by
      # tests/test_fleet_frames.py rather than trusted.
      rolling_window: false
      width: 34
      height: 20
      origin_x: -15.0
      origin_y: -10.0
      footprint: "__FOOTPRINT__"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # Costmap filters are a SEPARATE list from plugins, and deliberately so:
      # LayeredCostmap keeps plugins_ and filters_ apart and runs filters last, on a
      # combined copy, "to avoid interferences of work between plugins and filters".
      # Putting a filter in `plugins` above loads without error and then composes in
      # the wrong order. A useful side effect of the correct placement: inflation
      # never inflates the ramp cost, which is what a graded traversability cost
      # wants.
      #
      # PHASE 3 ships this wired with an all-zero mask - the plumbing is verified,
      # the cost is provably nothing. Phase 4 authors the graded ramp mask.
      filters: ["ramp_filter"]
      ramp_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        # Absolute: the filter-info server is fleet-wide and unnamespaced, while
        # this costmap node lives at /<robot>/global_costmap/global_costmap.
        filter_info_topic: "/ramp_filter_info"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # ABSOLUTE and explicit. The stock params omit this and let the layer
        # resolve a relative "map" against its own node, which sits at
        # /<robot>/global_costmap/global_costmap - a namespace deep enough that
        # what the relative name resolves to is not obvious from reading it.
        # Phase 3 points it at FleetMapNode's composited map; slam_toolbox's own
        # per-robot map is now an INPUT to that node rather than a costmap input.
        map_topic: __GLOBAL_MAP_TOPIC__
        # Must stay true: FleetMapNode publishes TRANSIENT_LOCAL, and a VOLATILE
        # subscriber here would silently fail to match it - no warning on either end,
        # just a costmap that never receives a map.
        map_subscribe_transient_local: true
        # Nothing publishes /fleet_map_updates. FleetMapNode republishes whole grids,
        # so leaving this true would only create a subscription that never fires.
        subscribe_to_updates: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: __SCAN_TOPIC__
          sensor_frame: ""
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: -1.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.70
        cost_scaling_factor: 2.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: __ODOM_FRAME__
    # Moved for consistency with bt_navigator and the global costmap, not because
    # it is load-bearing: Spin, BackUp and DriveOnHeading all operate in local_frame
    # above. Leaving it pointing at a frame nothing else plans in would be a trap
    # for whoever adds a global-frame behaviour later.
    global_frame: __GLOBAL_FRAME__
    robot_base_frame: __BASE_FRAME__
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Rewritten per robot from fleet.yaml.
    max_rotational_vel: __WZ_MAX__
    min_rotational_vel: 0.4
    rotational_acc_lim: __AZ_MAX__

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ============================================================================
# THE STOCK VELOCITY SMOOTHER - first link of the payload-adaptive motion chain
# (assignment 3.1). Nav2 is EXTENDED here, not duplicated (ENGINEERING_NOTES rule 6):
# this node contributes the velocity and acceleration bounds, and our
# PayloadJerkAdapter downstream contributes only what it lacks - a jerk bound
# and payload scaling.
#
#   cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed -> PayloadJerkAdapter
#
# It is a LIFECYCLE node. See amr_navigation.params.lifecycle_nodes() for why
# that matters more than it looks like it should.
# ============================================================================
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    # Clamp each axis independently rather than scaling the whole twist to fit.
    # Scaling would silently alter the commanded ARC to respect a limit on one
    # axis, which changes the path the controller asked for.
    scale_velocities: false
    # OPEN_LOOP: shape against the last command issued, not against odometry.
    # CLOSED_LOOP would make this node's output depend on measured velocity,
    # and the measured velocity already reflects SafetyGate's interventions
    # downstream - so a halt would feed back into the smoother as though the
    # controller had asked for it.
    feedback: "OPEN_LOOP"
    max_velocity: [__VX_MAX__, 0.0, __WZ_MAX__]
    min_velocity: [__VX_MIN__, 0.0, -__WZ_MAX__]
    max_accel: [__AX_MAX__, 0.0, __AZ_MAX__]
    max_decel: [__AX_MIN__, 0.0, -__AZ_MAX__]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # STATED EXPLICITLY, because the default is not stable across Nav2 releases
    # and the failure is silent. The rest of this command chain - SafetyGate,
    # drive_watchdog, the Gazebo DiffDrive plugin - is plain geometry_msgs/Twist.
    # Publish TwistStamped instead and no subscriber matches, no error is logged
    # anywhere, and the robot simply never moves.
    enable_stamped_cmd_vel: false
