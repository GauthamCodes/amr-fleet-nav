# ============================================================================
# fleet.yaml - the single typed robot list for the AMR fleet.
#
# This file is the ONLY place a robot difference is expressed. Launch files loop
# over this list; the same amr.urdf.xacro is processed once per entry with that
# entry's values as xacro arguments. There is no per-robot xacro, no per-robot
# launch file, and no "if robot == amr1" anywhere in the codebase.
#
# Scaling the fleet is an edit to this file: appending an amr3 block spawns a
# third robot with its own namespace, frames, limits and Nav2 stack. That is what
# "configuration-driven scaling" means here - it is not free, it is bounded to
# this file.
#
# UNITS
#   *_kg              kilograms
#   wheel_*           metres
#   lidar_height      metres ABOVE GROUND (not above base_link)
#   max_vel_x         m/s
#   max_accel_x       m/s^2   (positive)
#   max_decel_x       m/s^2   (negative)
#   max_vel_theta     rad/s
#   max_accel_theta   rad/s^2
#   spawn.yaw         radians
# ============================================================================

fleet:

  # --------------------------------------------------------------------------
  # AMR-1 "Mapper / Lead" - heavier, higher payload capacity, lower acceleration.
  # Per the assignment: focus on accurate global localization and path planning.
  # --------------------------------------------------------------------------
  - name: amr1
    type: mapper_lead
    base_mass_kg: 30.0
    payload_kg: 60.0
    wheel_separation: 0.44
    wheel_radius: 0.10
    base_length: 0.70
    base_width: 0.45
    base_height: 0.20
    # ABOVE THE CHASSIS, not inside it. At the Phase 0 value of 0.20 m the scan
    # plane sat exactly on the drive-wheel tops (2 * wheel_radius) and grazed
    # them: 18 beams per scan returned 0.44-0.49 m off the robot's own wheels,
    # slam_toolbox mapped them as static obstacles at the robot's own position,
    # and the inflation around them enclosed the start cell so the global planner
    # could not produce a path at all. See docs/SESSION_LOG.md, Phase 1.
    # Constraint, asserted by tests/test_fleet_parameterization.py:
    #     lidar_height > wheel_radius + base_height   (the chassis top)
    lidar_height: 0.35
    max_vel_x: 0.60
    max_accel_x: 0.40
    max_decel_x: -0.80
    max_vel_theta: 1.00
    max_accel_theta: 1.20
    # In the main aisle. Rack rows occupy y in [2.75, 3.65] and [-3.65, -2.75] at
    # x = -12, -8.4, -4.8, -1.2, +2.4, so the aisle |y| < 2.75 is clear for all x.
    # The previous (-8.0, -3.0) put this robot's entire footprint inside rack_south_1;
    # tests/test_spawn_poses_are_clear.py now guards against that.
    spawn: {x: -11.0, y: -1.5, z: 0.15, yaw: 0.0}

  # --------------------------------------------------------------------------
  # AMR-2 "Scout / Follower" - lighter, lower payload, higher acceleration.
  # Per the assignment: focus on speed and dynamic obstacle avoidance.
  # --------------------------------------------------------------------------
  - name: amr2
    type: scout_follower
    base_mass_kg: 18.0
    payload_kg: 5.0
    wheel_separation: 0.36
    wheel_radius: 0.10
    base_length: 0.55
    base_width: 0.38
    base_height: 0.18
    # Same constraint as amr1; this chassis is 0.02 m lower, and the fleet shares
    # one sensor mast height rather than deriving a different one per robot.
    lidar_height: 0.35
    max_vel_x: 1.00
    max_accel_x: 1.00
    max_decel_x: -1.40
    max_vel_theta: 1.80
    max_accel_theta: 2.50
    spawn: {x: -11.0, y: 1.5, z: 0.15, yaw: 0.0}
